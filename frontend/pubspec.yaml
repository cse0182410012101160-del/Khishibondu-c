name: agro_bridge
description: "Agro-Bridge: Farmer-to-Buyer Marketplace with Embedded Microfinance for Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  flutter_image_compress: ^2.4.0

  # Firebase — real-time chat, push notifications & crash reporting
  firebase_core: ^3.2.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.1

  # Maps & GPS — market discovery & weather alerts
  google_maps_flutter: ^2.8.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
